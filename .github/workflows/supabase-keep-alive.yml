name: Supabase Keep-Alive

on:
  schedule:
    # Every 6 hours (4x/day). Supabase pauses Free projects with too little
    # "user database activity" over a 7-day window; the docs say a *few* DB
    # requests each day are needed. One request/day was marginal, so we run
    # several times a day and issue multiple queries per run.
    - cron: '37 */6 * * *'  # 00:37, 06:37, 12:37, 18:37 UTC
  workflow_dispatch:         # Allow manual trigger

# Needed so the failure step can open a tracking issue.
permissions:
  contents: read
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase DB
        run: |
          # Query several real tables via PostgREST so each run generates
          # multiple genuine database requests. RLS returns empty results with
          # HTTP 200, which is fine — the queries still exercise Postgres.
          # (The old /auth/v1/settings ping did NOT count as DB activity.)
          #
          # --retry-all-errors also retries DNS/connection errors, covering the
          # transient curl exit 6 / HTTP 000 runner network blips seen before.
          set -e
          base="${{ secrets.SUPABASE_URL }}/rest/v1"
          for table in users ingredients_cache analyses_history; do
            curl --fail -sS \
              --retry 5 --retry-delay 5 --retry-all-errors \
              --connect-timeout 15 --max-time 60 \
              "$base/$table?select=*&limit=1" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
              -o /dev/null -w "$table -> HTTP %{http_code}\n"
          done

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ensure the label exists (no-op if it already does).
          gh label create keep-alive-failure --color B60205 --description "Supabase keep-alive workflow failure" --repo "${{ github.repository }}" 2>/dev/null || true

          # Only open a new issue if one isn't already open, so a sustained
          # outage doesn't file a new issue every single run.
          existing=$(gh issue list --state open --label keep-alive-failure --repo "${{ github.repository }}" --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh issue create --repo "${{ github.repository }}" --title "Supabase keep-alive failed" --label keep-alive-failure --body "Keep-alive failed on $(date -u '+%Y-%m-%d %H:%M UTC'). The project may be paused or unreachable (dashboard: https://supabase.com/dashboard/project/vuiaqdkbpkbcvyrzpmzv). Failing run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} . This issue is reused and will not re-file each run; close it once the keep-alive is green again."
          else
            echo "An open keep-alive-failure issue already exists; not filing another."
          fi
